name: delete issue comments

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: delete-issue-46-comments
  cancel-in-progress: false

jobs:
  delete-comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2

      - run: pnpm run delete-issue-comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
